name: Public event registry watch

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-public-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate registry and known Mox listings
        id: event-check
        shell: bash
        run: |
          set +e
          node tools/check-public-events.mjs --report public-event-watch-report.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Save watcher report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-event-watch-report
          path: public-event-watch-report.json
          retention-days: 30

      - name: Open or update event-watch issue
        if: steps.event-check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const report = JSON.parse(fs.readFileSync("public-event-watch-report.json", "utf8"));
            const title = "[Event watch] Public event registry needs attention";
            const issueList = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "all",
              per_page: 100
            });
            const existing = issueList.data.find((issue) => issue.title === title);
            const issueLines = report.issues.map((issue) => `- **${issue.code}:** ${issue.message}`).join("\n");
            const body = [
              "The scheduled public-event watcher found a registry or Mox-listing mismatch.",
              "",
              issueLines || "- Review the attached workflow artifact.",
              "",
              `Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            ].join("\n");

            if (existing) {
              if (existing.state === "closed") {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: existing.number,
                  state: "open"
                });
              }
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
            }

      - name: Close resolved event-watch issue
        if: steps.event-check.outputs.exit_code == '0'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "[Event watch] Public event registry needs attention";
            const issueList = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              per_page: 100
            });
            const existing = issueList.data.find((issue) => issue.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: "The public event registry and watched Mox listings are aligned again."
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                state: "closed"
              });
            }

      - name: Fail when the registry needs attention
        if: steps.event-check.outputs.exit_code != '0'
        run: exit 1
