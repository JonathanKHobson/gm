<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Display - Goldspire Story Atlas</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/run-mode.css">
</head>
<body class="player-display-v2" data-display-mode="waiting">
  <main id="player-screen" class="player-screen" tabindex="-1" aria-live="polite"></main>
  <aside class="player-display-tools" aria-label="Player display controls">
    <button type="button" data-player-action="blackout" aria-label="Blackout display">Blackout</button>
    <button type="button" data-player-action="image-title-caption" aria-label="Show image and caption">Image + Caption</button>
    <button type="button" data-player-action="read-aloud-fullscreen" aria-label="Show read-aloud">Read-Aloud</button>
    <button type="button" data-player-action="font-up" aria-label="Increase font size">A+</button>
    <button type="button" data-player-action="font-down" aria-label="Decrease font size">A-</button>
    <button type="button" data-player-action="contrast" aria-label="Toggle high contrast">Contrast</button>
    <button type="button" data-player-action="motion" aria-label="Toggle reduced motion">Motion</button>
    <button type="button" data-player-action="fullscreen" aria-label="Fullscreen">Fullscreen</button>
  </aside>
  <dialog id="player-image-dialog" class="run-dialog run-media-dialog" aria-label="Expanded player image">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close image">x</button>
      <img id="player-expanded-image" alt="">
      <p id="player-expanded-caption"></p>
    </form>
  </dialog>
  <dialog id="player-text-dialog" class="run-dialog run-text-dialog" aria-label="Expanded player text">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close text">x</button>
      <h1 id="player-expanded-title"></h1>
      <p id="player-expanded-text"></p>
    </form>
  </dialog>
  <script src="data/slides-data.js"></script>
  <script src="js/display-sync.js"></script>
  <script src="js/player-display.js"></script>
</body>
</html>
