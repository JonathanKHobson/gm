<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Player Display - Goldspire Story Atlas</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/run-mode.css">
</head>
<body class="player-display-v2" data-display-mode="waiting">
  <nav class="sticky-top-nav universal-nav" aria-label="Site navigation"><a href="index.html">Atlas</a><a href="run.html">Run Mode</a><a href="pages/gm-dashboard.html">Dashboard</a><a href="pages/entity-index.html">Wiki</a><a href="pages/pc-cheat-sheet.html">PCs</a><a href="pages/handouts.html">Handouts</a><a href="player-display.html" aria-current="page">Player Display</a></nav>
  <main id="player-screen" class="player-screen" tabindex="-1" aria-live="polite"></main>
  <aside class="player-display-tools" aria-label="Player display controls">
    <button class="run-icon-button" type="button" data-player-action="blackout" aria-label="Blackout display" title="Blackout display"><img src="assets/icons/action-blackout.png" alt="" aria-hidden="true"><span class="sr-only">Blackout display</span></button>
    <button class="run-icon-button" type="button" data-player-action="image-title-caption" aria-label="Show image and caption" title="Show image and caption"><img src="assets/icons/action-open-image.png" alt="" aria-hidden="true"><span class="sr-only">Show image and caption</span></button>
    <button class="run-icon-button" type="button" data-player-action="read-aloud-fullscreen" aria-label="Show read-aloud" title="Show read-aloud"><img src="assets/icons/action-reveal.png" alt="" aria-hidden="true"><span class="sr-only">Show read-aloud</span></button>
    <button class="run-icon-button" type="button" data-player-action="font-up" aria-label="Increase font size" title="Increase font size"><img src="assets/icons/action-expand-all.png" alt="" aria-hidden="true"><span class="sr-only">Increase font size</span></button>
    <button class="run-icon-button" type="button" data-player-action="font-down" aria-label="Decrease font size" title="Decrease font size"><img src="assets/icons/action-collapse-all.png" alt="" aria-hidden="true"><span class="sr-only">Decrease font size</span></button>
    <button class="run-icon-button" type="button" data-player-action="contrast" aria-label="Toggle high contrast" title="Toggle high contrast"><img src="assets/icons/action-settings.png" alt="" aria-hidden="true"><span class="sr-only">Toggle high contrast</span></button>
    <button class="run-icon-button" type="button" data-player-action="motion" aria-label="Toggle reduced motion" title="Toggle reduced motion"><img src="assets/icons/action-settings.png" alt="" aria-hidden="true"><span class="sr-only">Toggle reduced motion</span></button>
    <button class="run-icon-button" type="button" data-player-action="fullscreen" aria-label="Fullscreen" title="Fullscreen"><img src="assets/icons/action-fullscreen.png" alt="" aria-hidden="true"><span class="sr-only">Fullscreen</span></button>
  </aside>
  <dialog id="player-image-dialog" class="run-dialog run-media-dialog" aria-label="Expanded player image">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close image">x</button>
      <img id="player-expanded-image" alt="">
      <p id="player-expanded-caption"></p>
    </form>
  </dialog>
  <dialog id="player-text-dialog" class="run-dialog run-text-dialog" aria-label="Expanded player text">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close text">x</button>
      <h1 id="player-expanded-title"></h1>
      <p id="player-expanded-text"></p>
    </form>
  </dialog>
  <script src="data/slides-data.js"></script>
  <script src="js/display-sync.js"></script>
  <script src="js/player-display.js"></script>
</body>
</html>
