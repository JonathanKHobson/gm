<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run Mode - Goldspire Story Atlas</title>
  <link rel="icon" href="assets/favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/run-mode.css">
</head>
<body class="slideshow-run-page">
  <a class="skip-link" href="#slide-stage">Skip to current slide</a>
  <nav class="sticky-top-nav universal-nav" aria-label="Site navigation"><a href="index.html">Atlas</a><a href="run.html" aria-current="page">Run Mode</a><a href="pages/gm-dashboard.html">Dashboard</a><a href="pages/entity-index.html">Wiki</a><a href="pages/pc-cheat-sheet.html">PCs</a><a href="pages/handouts.html">Handouts</a><a href="player-display.html">Player Display</a></nav>
  <header class="run-topbar" role="banner">
    <div class="run-toolbar-group" aria-label="Slide navigation">
      <button class="run-icon-button" type="button" data-run-action="previous" aria-label="Previous slide" title="Previous slide"><img src="assets/icons/action-prev.png" alt="" aria-hidden="true"><span class="sr-only">Previous slide</span></button>
      <button class="run-icon-button" type="button" data-run-action="next" aria-label="Next slide" title="Next slide"><img src="assets/icons/action-next.png" alt="" aria-hidden="true"><span class="sr-only">Next slide</span></button>
    </div>
    <label class="run-slide-jump">Slide <select id="run-slide-select" aria-label="Jump to slide"></select></label>
    <div class="run-toolbar-group" aria-label="View controls">
      <button class="run-labeled-button" type="button" data-run-action="toggle-image" aria-label="Hide image" title="Hide image"><img src="assets/icons/action-open-image.png" alt="" aria-hidden="true"><span class="run-button-label">Hide image</span></button>
      <button class="run-labeled-button" type="button" data-run-action="toggle-filmstrip" aria-label="Show filmstrip" title="Show filmstrip"><img src="assets/icons/action-collapse-all.png" alt="" aria-hidden="true"><span class="run-button-label">Show filmstrip</span></button>
    </div>
    <div class="run-toolbar-group" aria-label="Player display controls">
      <button class="run-icon-button" type="button" data-run-action="open-display" aria-label="Open player display" title="Open player display"><img src="assets/icons/action-player-display.png" alt="" aria-hidden="true"><span class="sr-only">Open player display</span></button>
      <button class="run-icon-button danger" type="button" data-run-action="blackout" aria-label="Blackout player display" title="Blackout player display"><img src="assets/icons/action-blackout.png" alt="" aria-hidden="true"><span class="sr-only">Blackout player display</span></button>
    </div>
    <details class="run-overflow">
      <summary class="run-icon-button" aria-label="More controls" title="More controls"><img src="assets/icons/action-settings.png" alt="" aria-hidden="true"><span class="sr-only">More controls</span></summary>
      <div class="run-overflow-menu" role="group" aria-label="More controls">
        <button class="run-labeled-button" type="button" data-run-action="first" aria-label="First slide" title="First slide"><img src="assets/icons/action-first.png" alt="" aria-hidden="true"><span class="run-button-label">First slide</span></button>
        <button class="run-labeled-button" type="button" data-run-action="last" aria-label="Last slide" title="Last slide"><img src="assets/icons/action-last.png" alt="" aria-hidden="true"><span class="run-button-label">Last slide</span></button>
        <button class="run-labeled-button" type="button" data-run-action="shortcuts" aria-label="Keyboard shortcuts" title="Keyboard shortcuts"><img src="assets/icons/action-help.png" alt="" aria-hidden="true"><span class="run-button-label">Keyboard shortcuts</span></button>
      </div>
    </details>
  </header>

  <main class="run-layout" id="slide-stage">
    <aside class="run-side-panel" aria-label="Run controls">
      <p class="run-kicker">Live-session slideshow</p>
      <h1>Run Mode</h1>
      <p id="run-position" class="run-position">Loading slides...</p>
      <label class="run-check"><input id="run-auto-complete" type="checkbox"> Auto-complete previous on Next</label>
      <label class="run-check"><input id="run-sync-on-change" type="checkbox" checked> Sync slide changes to Player Display</label>
      <div class="run-side-actions">
        <button class="run-icon-button" type="button" data-run-action="toggle-complete" aria-label="Mark current slide complete" title="Mark current slide complete"><img src="assets/icons/action-complete.png" alt="" aria-hidden="true"><span class="sr-only">Mark current slide complete</span></button>
        <button class="run-icon-button" type="button" data-run-action="pin" aria-label="Pin current slide" title="Pin current slide"><img src="assets/icons/action-pin.png" alt="" aria-hidden="true"><span class="sr-only">Pin current slide</span></button>
        <button class="run-icon-button" type="button" data-run-action="copy-text" aria-label="Copy player text" title="Copy player text"><img src="assets/icons/action-copy.png" alt="" aria-hidden="true"><span class="sr-only">Copy player text</span></button>
        <button class="run-icon-button" type="button" data-run-action="copy-discord" aria-label="Copy player text as Markdown quote" title="Copy player text as Markdown quote"><img src="assets/icons/action-handouts.png" alt="" aria-hidden="true"><span class="sr-only">Copy player text as Markdown quote</span></button>
      </div>
      <details class="run-scratch">
        <summary>Scratch note</summary>
        <textarea id="run-scratch-note" data-disable-shortcuts rows="4" placeholder="Private live note. Shortcuts are disabled while typing here."></textarea>
      </details>
      <nav class="run-cheat-menu" aria-label="Cheat sheet shortcuts">
        <button type="button" data-run-go-slide="CHEAT-GM">1 GM Cheat</button>
        <button type="button" data-run-go-slide="CHEAT-CONDITIONS">2 Conditions</button>
        <button type="button" data-run-go-slide="CHEAT-SLIDER">3 Slider</button>
        <button type="button" data-run-go-slide="CHEAT-PC">4 PC Sheet</button>
        <button type="button" data-run-go-slide="CHEAT-PRONUNCIATION">5 Pronunciation</button>
      </nav>
    </aside>

    <section class="run-slide-stage" aria-live="polite">
      <button class="deck-arrow deck-arrow-prev" type="button" data-run-action="previous" aria-label="Previous slide" title="Previous slide"><img src="assets/icons/action-prev.png" alt="" aria-hidden="true"><span class="sr-only">Previous slide</span></button>
      <article id="run-slide-root" class="run-slide-card" data-slide-root></article>
      <button class="deck-arrow deck-arrow-next" type="button" data-run-action="next" aria-label="Next slide" title="Next slide"><img src="assets/icons/action-next.png" alt="" aria-hidden="true"><span class="sr-only">Next slide</span></button>
      <p id="run-status" class="run-status" role="status" aria-live="polite"></p>
    </section>
  </main>

  <footer class="run-bottom-scrubber" aria-label="Slide scrubber">
    <div id="run-scrubber" class="run-scrubber-track" data-slide-scrubber tabindex="0" aria-label="Timeline scrubber"></div>
  </footer>

  <dialog id="shortcut-help" class="run-dialog" aria-label="Keyboard shortcuts">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close shortcuts">x</button>
      <h2>Keyboard Shortcuts</h2>
      <div id="shortcut-list" class="shortcut-list"></div>
    </form>
  </dialog>
  <dialog id="run-image-dialog" class="run-dialog run-media-dialog" aria-label="Expanded image">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close image">x</button>
      <img id="run-expanded-image" alt="">
      <p id="run-expanded-caption"></p>
      <a id="run-expanded-raw" class="run-icon-button" target="_blank" rel="noopener" aria-label="Open raw image" title="Open raw image"><img src="assets/icons/action-open-image.png" alt="" aria-hidden="true"><span class="sr-only">Open raw image</span></a>
    </form>
  </dialog>
  <dialog id="run-text-dialog" class="run-dialog run-text-dialog" aria-label="Expanded player text">
    <form method="dialog">
      <button class="dialog-close" value="close" aria-label="Close text">x</button>
      <h2 id="run-expanded-text-title"></h2>
      <p id="run-expanded-text"></p>
    </form>
  </dialog>

  <aside id="hover-card" class="hover-card" role="dialog" aria-label="Entity quick reference" aria-hidden="true"></aside>

  <script src="data/atlas-data.js"></script>
  <script src="data/slides-data.js"></script>
  <script src="js/display-sync.js"></script>
  <script src="js/run-mode.js"></script>
</body>
</html>
